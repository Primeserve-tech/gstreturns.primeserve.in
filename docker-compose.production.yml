# Standalone production Compose file for Coolify; associate gstreturns.primeserve.in with web:80.
services:
  web:
    build: .
    image: primeserve-gst-returns:production
    restart: unless-stopped
    init: true
    env_file: .env.production
    volumes:
      - returns-data:/var/www/html/writable
      - returns-temp:/run/returns-temp
    environment:
      CI_ENVIRONMENT: production
      app_baseURL: https://gstreturns.primeserve.in/
      app_forceGlobalSecureRequests: "true"
      cookie_secure: "true"
      GST_TEMP_DIR: /run/returns-temp
  worker:
    image: primeserve-gst-returns:production
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.production
    command: ["runuser", "-u", "www-data", "--", "php", "spark", "returns:process-v3"]
    volumes:
      - returns-data:/var/www/html/writable
      - returns-temp:/run/returns-temp
    environment:
      GST_TEMP_DIR: /run/returns-temp
    healthcheck:
      test: ["CMD", "php", "docker/worker-health.php"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  janitor:
    image: primeserve-gst-returns:production
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.production
    command: ["runuser", "-u", "www-data", "--", "php", "spark", "returns:purge-v3"]
    environment:
      GST_TEMP_DIR: /run/returns-temp
    volumes:
      - returns-data:/var/www/html/writable
      - returns-temp:/run/returns-temp
    healthcheck:
      test: ["CMD", "php", "docker/janitor-health.php"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
volumes:
  returns-data:
  returns-temp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=33,gid=33,mode=0700
